<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recut CLI 指令生成</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app" class="p-4">
    <!-- 标题栏 -->
    <header class="flex items-center justify-between mb-4">
      <h1 class="text-lg font-semibold text-gray-800">Recut CLI 指令生成</h1>
      <div class="flex gap-2">
        <button id="retryBtn" class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded" title="重试">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </button>
        <button id="settingsBtn" class="p-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded" title="设置">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- 主内容区 -->
    <main id="mainContent">
      <!-- 加载状态 -->
      <div id="loadingState" class="flex items-center justify-center py-8">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
      </div>

      <!-- 内容表单 -->
      <form id="contentForm" class="hidden space-y-4">
        <!-- 页面URL -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">页面URL</label>
          <div class="url-field bg-gray-100 rounded px-3 py-2 text-sm text-gray-600 break-all">
            <span class="url-preview line-clamp-1" id="pageUrlPreview"></span>
            <span class="url-full hidden" id="pageUrlFull"></span>
            <button type="button" class="toggle-url float-right text-blue-600 hover:text-blue-800 ml-2" data-target="pageUrl">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>
          </div>
        </div>

        <!-- 页面标题 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">页面标题</label>
          <div class="flex gap-2">
            <select id="language" class="w-20 px-2 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="english">英文</option>
              <option value="chinese">中文</option>
            </select>
            <input type="text" id="pageTitle" class="flex-1 px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <!-- 主视频URL -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">主视频URL</label>
          <div class="url-field bg-gray-100 rounded px-3 py-2 text-sm text-gray-600 break-all">
            <span class="url-preview line-clamp-1" id="videoUrlPreview"></span>
            <span class="url-full hidden" id="videoUrlFull"></span>
            <button type="button" class="toggle-url float-right text-blue-600 hover:text-blue-800 ml-2" data-target="videoUrl">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>
          </div>
        </div>

        <!-- 封面图URL -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">封面图URL</label>
          <div class="url-field bg-gray-100 rounded px-3 py-2 text-sm text-gray-600 break-all">
            <span class="url-preview line-clamp-1" id="imageUrlPreview"></span>
            <span class="url-full hidden" id="imageUrlFull"></span>
            <button type="button" class="toggle-url float-right text-blue-600 hover:text-blue-800 ml-2" data-target="imageUrl">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </button>
          </div>
        </div>

        <!-- 配音引擎 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">配音引擎</label>
          <div class="flex gap-4">
            <label class="flex items-center">
              <input type="radio" name="ttsEngine" value="minimax" checked class="mr-2">
              <span class="text-sm">minimax</span>
            </label>
            <label class="flex items-center">
              <input type="radio" name="ttsEngine" value="edge" class="mr-2">
              <span class="text-sm">edge</span>
            </label>
          </div>
        </div>

        <!-- 按钮 -->
        <div class="space-y-2 pt-2">
          <button type="button" id="copyBtn" class="w-full py-2 px-4 bg-blue-600 text-white font-medium rounded hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
            复制指令
          </button>
          <button type="button" id="copySemiAutoBtn" class="w-full py-2 px-4 bg-gray-200 text-gray-700 font-medium rounded hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
            复制半自动指令
          </button>
        </div>
      </form>

      <!-- 配置表单 -->
      <form id="configForm" class="hidden space-y-4">
        <h2 class="text-md font-semibold text-gray-800">规则配置</h2>
        <p class="text-sm text-gray-600">当前域名: <span id="configDomain" class="font-mono"></span></p>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">视频标签</label>
          <div class="flex gap-2">
            <select id="videoSelectorType" class="w-20 px-2 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="id">id</option>
              <option value="class">class</option>
            </select>
            <input type="text" id="videoSelectorValue" class="flex-1 px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="如: z1">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">封面图标签</label>
          <div class="flex gap-2">
            <select id="imageSelectorType" class="w-20 px-2 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="id">id</option>
              <option value="class">class</option>
            </select>
            <input type="text" id="imageSelectorValue" class="flex-1 px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="如: z3">
          </div>
        </div>

        <button type="submit" class="w-full py-2 px-4 bg-blue-600 text-white font-medium rounded hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
          保存配置
        </button>
      </form>
    </main>

    <!-- Toast提示 -->
    <div id="toast" class="fixed bottom-4 left-4 right-4 hidden">
      <div class="bg-gray-800 text-white px-4 py-2 rounded shadow-lg text-sm"></div>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
